databaseChangeLog:
  # 1. Tablas independientes (no dependen de otras para crearse)
  - changeSet:
      id: 1-create-guardians
      author: alan
      changes:
        - createTable:
            tableName: guardians
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: first_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: last_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: phone, type: varchar(20) }
              - column: { name: email, type: varchar(100) }
              - column: { name: relationship, type: varchar(50) }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 2-create-instructors
      author: alan
      changes:
        - createTable:
            tableName: instructors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: first_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: last_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: phone, type: varchar(20) }
              - column: { name: email, type: varchar(100) }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 3-create-disciplines
      author: alan
      changes:
        - createTable:
            tableName: disciplines
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  # 2. Tablas con dependencias (Llaves foráneas)
  - changeSet:
      id: 4-create-students
      author: alan
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: first_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: last_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: birth_date, type: date, constraints: { nullable: false } }
              - column: { name: personal_phone, type: varchar(20) }
              - column: { name: personal_email, type: varchar(100) }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
              - column:
                  name: guardian_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_student_guardian
                    references: guardians(id)

  - changeSet:
      id: 5-create-classes
      author: alan
      changes:
        - createTable:
            tableName: classes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: discipline_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_class_discipline, references: disciplines(id) }
              - column: { name: level, type: varchar(50), constraints: { nullable: false } }
              - column: { name: day_of_week, type: varchar(100), constraints: { nullable: false } }
              - column: { name: start_time, type: time, constraints: { nullable: false } }
              - column: { name: end_time, type: time, constraints: { nullable: false } }
              - column: { name: max_capacity, type: int, constraints: { nullable: false } }
              - column: { name: monthly_price, type: "numeric(10,2)", defaultValueNumeric: "0", constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), defaultValue: 'Active' }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 6-create-class-instructors
      author: alan
      changes:
        - createTable:
            tableName: class_instructors
            columns:
              - column:
                  name: class_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_ci_class, references: classes(id) }
              - column:
                  name: instructor_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_ci_instructor, references: instructors(id) }
        - createIndex:
            indexName: idx_class_instructor
            tableName: class_instructors
            columns:
              - column: { name: class_id }
              - column: { name: instructor_id }

  - changeSet:
      id: 7-create-enrollments
      author: alan
      changes:
        - createTable:
            tableName: enrollments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: student_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_enrollment_student, references: students(id) }
              - column:
                  name: class_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_enrollment_class, references: classes(id) }
              - column: { name: enrollment_date, type: date, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false } }
              - column: { name: agreed_price, type: "numeric(10,2)", remarks: 'Precio personalizado. Si es nulo, usa Classes.monthly_price' }
              - column: { name: status, type: varchar(20), defaultValue: 'Active' }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 8-create-invoices
      author: alan
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: student_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_invoice_student, references: students(id) }
              - column: { name: timbrado, type: varchar(20), constraints: { nullable: false }, remarks: 'Nro de Timbrado' }
              - column: { name: invoice_number, type: varchar(20), constraints: { nullable: false }, remarks: 'Ej: 001-001-0000123' }
              - column: { name: tax_id, type: varchar(20), constraints: { nullable: false }, remarks: 'RUC o CI' }
              - column: { name: business_name, type: varchar(150), constraints: { nullable: false }, remarks: 'Razon Social' }
              - column: { name: issue_date, type: date, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false } }
              - column: { name: sale_condition, type: varchar(20), defaultValue: 'Contado' }
              - column: { name: total_amount, type: "numeric(10,2)", defaultValueNumeric: "0", constraints: { nullable: false } }
              - column: { name: total_iva, type: "numeric(10,2)", defaultValueNumeric: "0" }
              - column: { name: payment_status, type: varchar(20), defaultValue: 'Pending' }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 9-create-invoice-details
      author: alan
      changes:
        - createTable:
            tableName: invoice_details
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: invoice_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_inv_detail_invoice, references: invoices(id) }
              - column: { name: description, type: varchar(255), constraints: { nullable: false } }
              - column: { name: amount, type: "numeric(10,2)", constraints: { nullable: false } }
              - column: { name: vat_rate, type: int, defaultValueNumeric: "10", remarks: 'Porcentaje de IVA: 10, 5 o 0' }
              - column: { name: corresponding_month, type: varchar(20) }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 10-create-exams
      author: alan
      changes:
        - createTable:
            tableName: exams
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: class_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_exam_class, references: classes(id) }
              - column: { name: exam_name, type: varchar(150), constraints: { nullable: false } }
              - column: { name: exam_date, type: date, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 11-create-exam-results
      author: alan
      changes:
        - createTable:
            tableName: exam_results
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: exam_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_exresult_exam, references: exams(id) }
              - column:
                  name: student_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_exresult_student, references: students(id) }
              - column: { name: score, type: "numeric(5,2)" }
              - column: { name: remarks, type: text }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 12-create-instructor-payments
      author: alan
      changes:
        - createTable:
            tableName: instructor_payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: instructor_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_inspay_instructor, references: instructors(id) }
              - column: { name: payment_date, type: date, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false } }
              - column: { name: total_amount, type: "numeric(10,2)", defaultValueNumeric: "0", constraints: { nullable: false } }
              - column: { name: payment_method, type: varchar(50) }
              - column: { name: period, type: varchar(50) }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  - changeSet:
      id: 13-create-instructor-payment-details
      author: alan
      changes:
        - createTable:
            tableName: instructor_payment_details
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: instructor_payment_id
                  type: bigint
                  constraints: { nullable: false, foreignKeyName: fk_inspaydet_payment, references: instructor_payments(id) }
              - column: { name: description, type: varchar(255), constraints: { nullable: false } }
              - column: { name: amount, type: "numeric(10,2)", constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }

  # 3. Borrado logico: columnas active/deleted para toda entidad que hereda BaseEntity
  - changeSet:
      id: 14-add-soft-delete-columns
      author: alan
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE guardians ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE guardians ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE instructors ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE instructors ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE disciplines ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE disciplines ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE students ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE students ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE classes ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE classes ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE enrollments ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE enrollments ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE invoices ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE invoices ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE invoice_details ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE invoice_details ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE exams ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE exams ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE exam_results ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE exam_results ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE instructor_payments ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE instructor_payments ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;
              ALTER TABLE instructor_payment_details ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT true;
              ALTER TABLE instructor_payment_details ADD COLUMN IF NOT EXISTS deleted boolean NOT NULL DEFAULT false;