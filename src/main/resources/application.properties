spring.application.name=academic
server.port=${STOCK_SERVER_PORT:8082}
spring.config.import=classpath:config/private.properties

springdoc.api-docs.enabled=true


# app.pagination.page-size=25
# app.pagination.max-page-size=100

spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logs
logging.file.name=app.log
logging.level.com.jerokysys.academic=INFO
logging.level.com.jerokysys.academic.controllers=INFO
logging.level.com.jerokysys.academic.services=DEBUG
logging.level.com.jerokysys.academic.repo=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB

logging.level.org.hibernate.SQL=DEBUG

logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} %level [%X{traceId}] %logger - %msg%n
logging.pattern.console=%d{HH:mm:ss} %level [%X{traceId}] %logger - %msg%n

# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar usando IP en lugar del hostname
eureka.instance.prefer-ip-address=true

# ------------
# Redis Cache
# ------------
# One Redis instance for this microservice. Every value comes from this file;
# the source code holds no cache literals.
cache.enabled=${CACHE_ENABLED:true}
cache.key-prefix=academic
cache.default-ttl-seconds=120
cache.scan-batch-size=100
cache.domains.discipline=120
cache.domains.danceclass=120
cache.domains.enrollment=30
cache.domains.exam=30
cache.domains.examresult=30

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# One line per cache operation. Set to WARN to silence it.
logging.level.com.jerokysys.academic.config.LoggingCache=${CACHE_LOG_LEVEL:INFO}

# ------------------------- Seguridad (JWT) -------------------------
jwt.secret=${JWT_SECRET}
jwt.algorithm=HS256
jwt.claim.user=username
jwt.claim.role=role
